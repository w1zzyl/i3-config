[bar/main]
width = 100%
height = 28
background = #cc1e1e2e
foreground = #ffffffff
border-size = 0
radius = 10
padding-left = 2
padding-right = 2
module-margin-left = 2
module-margin-right = 2

font-0 = "FiraCode Nerd Font:size=10;2"
font-1 = "monospace:size=10"

modules-center = xworkspaces
modules-left = date battery backlight pipewire
modules-right = tray

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; MODULES

[module/xworkspaces]
type = internal/xworkspaces
format = <label-state> 
label-active = %name%
label-active-foreground = #ffffff
label-active-background = #81a1c1
label-active-padding = 1
label-empty = 

[module/date]
type = internal/date
format = %{T0}%{T-} <label>
interval = 1.0
date = %d-%m%
time = %H:%M
label = %date%   %time%

[module/battery]
type = internal/battery
full-at = 99
low-at = 5
battery = BAT0
adapter = ADP1
poll-interval = 5
time-format = %H:%M
format-charging = "%{T0}<animation-charging>%{T-} <label-charging>"
format-discharging = "%{T0}<ramp-capacity>%{T-} <label-discharging>"
format-full = "%{T0}%{T-} Full"
label-charging = Charging %percentage%%
label-discharging = Discharging %percentage%%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
animation-charging = true
animation-charging-framerate = 750
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 

[module/backlight]
type = internal/backlight
format = %{T0}%{T-}  <label>
card = intel_backlight
poll-interval = 0
label = %percentage%%

[module/pipewire]
type = custom/script
label = %{T0}%{T-} "%output%"
label-font = 2
interval = 0.1
exec = ~/.config/polybar/pipewire.sh
click-right = exec pavucontrol &
click-left = ~/.config/polybar/pipewire.sh mute &
scroll-up = ~/.config/polybar/pipewire.sh up &
scroll-down = ~/.config/polybar/pipewire.sh down &

[module/tray]
type = internal/tray
format = <tray>
tray-spacing = 10px
tray-padding = 10px

